<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">

  <g id="bg">
    <rect width="1280" height="720" fill="#FFF8EE" />
  </g>

  <!-- Header -->
  <g id="header">
    <rect x="60" y="55" width="14" height="60" fill="#FF3DA5" />
    <text x="90" y="95" font-family="Impact, Arial Black, sans-serif" font-size="48" font-weight="900" fill="#1A1A2E" letter-spacing="1">ONE NUMBER</text>
    <text x="90" y="125" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#5C5C7A" letter-spacing="3">数据亮点 · HEADLINE STAT</text>
    <g transform="translate(1140, 60)">
      <rect x="0" y="0" width="26" height="26" fill="#FF3DA5" stroke="#1A1A2E" stroke-width="2" />
      <rect x="28" y="0" width="26" height="26" fill="#00B8D9" stroke="#1A1A2E" stroke-width="2" />
      <rect x="0" y="28" width="26" height="26" fill="#00C896" stroke="#1A1A2E" stroke-width="2" />
      <rect x="28" y="28" width="26" height="26" fill="#FFD93D" stroke="#1A1A2E" stroke-width="2" />
    </g>
  </g>

  <!-- 超大数字 -->
  <text x="640" y="380" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="140" font-weight="900" fill="#1A1A2E" letter-spacing="-3">94.7%</text>

  <!-- 标签 -->
  <text x="640" y="430" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#5C5C7A">of generated slides pass layout validation</text>

  <!-- 装饰下划线 -->
  <rect x="460" y="454" width="360" height="4" rx="2" fill="#FF3DA5" />

  <!-- 说明卡片 -->
  <g id="context">
    <path fill="#FFF8EE" stroke="#1A1A2E" stroke-width="4" d="M310,490 H970 A14,14 0 0 1 984,504 V610 A14,14 0 0 1 970,624 H310 A14,14 0 0 1 296,610 V504 A14,14 0 0 1 310,490 Z" />
    <circle cx="342" cy="540" r="6" fill="#FF3DA5" stroke="#1A1A2E" stroke-width="2" />
    <text x="362" y="546" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1A1A2E">Tested across 12 input types: Markdown, HTML, URLs</text>
    <circle cx="342" cy="572" r="6" fill="#FF3DA5" stroke="#1A1A2E" stroke-width="2" />
    <text x="362" y="578" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1A1A2E">Checks: overflow, contrast, alignment, spacing</text>
    <circle cx="342" cy="604" r="6" fill="#FF3DA5" stroke="#1A1A2E" stroke-width="2" />
    <text x="362" y="610" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1A1A2E">Remaining 5.3% auto-fixed by reflow engine</text>
  </g>

  <!-- Footer -->
  <g id="footer">
    <text x="60" y="700" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#5C5C7A">数据亮点 · 关键指标聚焦</text>
    <text x="1220" y="700" text-anchor="end" font-family="Impact, sans-serif" font-size="14" font-weight="900" fill="#1A1A2E" letter-spacing="3">09 / 12</text>
  </g>

</svg>
