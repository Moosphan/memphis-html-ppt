    <rect x="100" y="618" width="360" height="10" rx="5" fill="#00C896" />
    <text x="100" y="648" font-family="Impact, sans-serif" font-size="14" font-weight="900" fill="#00C896" letter-spacing="1">4 / 9 COMPLETE</text>
