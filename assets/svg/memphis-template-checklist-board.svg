    <text x="940" y="562" font-family="Impact, sans-serif" font-size="15" font-weight="900" fill="#1A1A2E">Phase 2</text>
    <text x="940" y="580" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#5C5C7A">Validation + reflow</text>

    <circle cx="920" cy="616" r="6" fill="#00C896" stroke="#1A1A2E" stroke-width="2" />
    <text x="940" y="622" font-family="Impact, sans-serif" font-size="15" font-weight="900" fill="#1A1A2E">Phase 3</text>
    <text x="940" y="640" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#5C5C7A">Full deck generation</text>
