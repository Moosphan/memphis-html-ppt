    <text x="936" y="293" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1A1A2E">Blockers must be resolved first</text>
    <circle cx="920" cy="318" r="5" fill="#FFD93D" stroke="#1A1A2E" stroke-width="2" />
