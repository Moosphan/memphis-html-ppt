<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">

  <g id="bg">
    <rect width="1280" height="720" fill="#FFF8EE" />
  </g>

  <!-- Header -->
  <g id="header">
    <rect x="60" y="55" width="14" height="60" fill="#00C896" />
    <text x="90" y="95" font-family="Impact, Arial Black, sans-serif" font-size="48" font-weight="900" fill="#1A1A2E" letter-spacing="1">THANK YOU</text>
    <text x="90" y="125" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#5C5C7A" letter-spacing="3">结束语 · CLOSING THOUGHTS</text>
    <g transform="translate(1140, 60)">
      <rect x="0" y="0" width="26" height="26" fill="#FF3DA5" stroke="#1A1A2E" stroke-width="2" />
      <rect x="28" y="0" width="26" height="26" fill="#00B8D9" stroke="#1A1A2E" stroke-width="2" />
      <rect x="0" y="28" width="26" height="26" fill="#00C896" stroke="#1A1A2E" stroke-width="2" />
      <rect x="28" y="28" width="26" height="26" fill="#FFD93D" stroke="#1A1A2E" stroke-width="2" />
    </g>
  </g>

  <!-- 主标题 (居中) -->
  <text x="640" y="300" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="72" font-weight="900" fill="#1A1A2E" letter-spacing="2">DESIGN THE</text>
  <text x="640" y="380" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="72" font-weight="900" fill="#1A1A2E" letter-spacing="2">FUTURE.</text>

  <!-- 分隔线 -->
  <rect x="520" y="410" width="240" height="4" rx="2" fill="#00C896" />

  <!-- 副标题 -->
  <text x="640" y="460" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#5C5C7A">Build presentations that move people.</text>

  <!-- 4 个要点卡片 -->
  <g id="takeaway-1">
    <path fill="#FFF8EE" stroke="#1A1A2E" stroke-width="4" d="M74,510 H330 A14,14 0 0 1 344,524 V610 A14,14 0 0 1 330,624 H74 A14,14 0 0 1 60,610 V524 A14,14 0 0 1 74,510 Z" />
    <path d="M 64 510 h 266 a 10 10 0 0 1 4 4 v 40 h -274 v -40 a 10 10 0 0 1 4 -4 Z" fill="#FF3DA5" />
    <text x="200" y="540" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="28" font-weight="900" fill="#1A1A2E" letter-spacing="-1">01</text>
    <text x="200" y="580" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1A1A2E">One message</text>
    <text x="200" y="600" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1A1A2E">per slide</text>
  </g>

  <g id="takeaway-2">
    <path fill="#FFF8EE" stroke="#1A1A2E" stroke-width="4" d="M370,510 H614 A14,14 0 0 1 628,524 V610 A14,14 0 0 1 614,624 H370 A14,14 0 0 1 356,610 V524 A14,14 0 0 1 370,510 Z" />
    <path d="M 360 510 h 254 a 10 10 0 0 1 4 4 v 40 h -262 v -40 a 10 10 0 0 1 4 -4 Z" fill="#00B8D9" />
    <text x="494" y="540" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="28" font-weight="900" fill="#1A1A2E" letter-spacing="-1">02</text>
    <text x="494" y="580" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1A1A2E">Whitespace</text>
    <text x="494" y="600" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1A1A2E">is your friend</text>
  </g>

  <g id="takeaway-3">
    <path fill="#FFF8EE" stroke="#1A1A2E" stroke-width="4" d="M666,510 H910 A14,14 0 0 1 924,524 V610 A14,14 0 0 1 910,624 H666 A14,14 0 0 1 652,610 V524 A14,14 0 0 1 666,510 Z" />
    <path d="M 656 510 h 254 a 10 10 0 0 1 4 4 v 40 h -262 v -40 a 10 10 0 0 1 4 -4 Z" fill="#FFD93D" />
    <text x="790" y="540" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="28" font-weight="900" fill="#1A1A2E" letter-spacing="-1">03</text>
    <text x="790" y="580" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1A1A2E">Color with</text>
    <text x="790" y="600" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1A1A2E">purpose</text>
  </g>

  <g id="takeaway-4">
    <path fill="#FFF8EE" stroke="#1A1A2E" stroke-width="4" d="M950,510 H1206 A14,14 0 0 1 1220,524 V610 A14,14 0 0 1 1206,624 H950 A14,14 0 0 1 936,610 V524 A14,14 0 0 1 950,510 Z" />
    <path d="M 940 510 h 266 a 10 10 0 0 1 4 4 v 40 h -274 v -40 a 10 10 0 0 1 4 -4 Z" fill="#00C896" />
    <text x="1080" y="540" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="28" font-weight="900" fill="#1A1A2E" letter-spacing="-1">04</text>
    <text x="1080" y="580" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1A1A2E">Test with</text>
    <text x="1080" y="600" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1A1A2E">strangers</text>
  </g>

  <!-- Footer -->
  <g id="footer">
    <text x="60" y="700" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#5C5C7A">Memphis-HTML-PPT · Premium Slide Design Framework · 2025</text>
    <text x="1220" y="700" text-anchor="end" font-family="Impact, sans-serif" font-size="14" font-weight="900" fill="#1A1A2E" letter-spacing="3">12 / 12</text>
  </g>

</svg>
