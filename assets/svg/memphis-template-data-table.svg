<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg"><rect width="1280" height="720" fill="#FFF8EE" /></g>
  <g id="header">
    <rect x="60" y="55" width="14" height="60" fill="#00B8D9" />
    <text x="90" y="95" font-family="Impact, Arial Black, sans-serif" font-size="48" font-weight="900" fill="#1A1A2E" letter-spacing="1">FEATURE COMPARISON</text>
    <text x="90" y="125" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#5C5C7A" letter-spacing="3">功能对比 · COMPARISON TABLE</text>
    <g transform="translate(1140, 60)"><rect x="0" y="0" width="26" height="26" fill="#FF3DA5" stroke="#1A1A2E" stroke-width="2" /><rect x="28" y="0" width="26" height="26" fill="#00B8D9" stroke="#1A1A2E" stroke-width="2" /><rect x="0" y="28" width="26" height="26" fill="#00C896" stroke="#1A1A2E" stroke-width="2" /><rect x="28" y="28" width="26" height="26" fill="#FFD93D" stroke="#1A1A2E" stroke-width="2" /></g>
  </g>

  <!-- 表格卡片 -->
  <g id="table">
    <path fill="#FFF8EE" stroke="#1A1A2E" stroke-width="4" d="M74,150 H1206 A14,14 0 0 1 1220,164 V644 A14,14 0 0 1 1206,658 H74 A14,14 0 0 1 60,644 V164 A14,14 0 0 1 74,150 Z" />

    <!-- 表头 -->
    <rect x="60" y="150" width="1160" height="52" fill="#00B8D9" />
    <text x="300" y="183" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="18" font-weight="900" fill="#FFF8EE" letter-spacing="2">FEATURE</text>
    <text x="640" y="183" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="18" font-weight="900" fill="#FFF8EE" letter-spacing="2">LEGACY</text>
    <text x="980" y="183" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="18" font-weight="900" fill="#FFF8EE" letter-spacing="2">PREMIUM</text>

    <!-- Row 1 -->
    <rect x="74" y="202" width="1132" height="56" fill="#FFF8EE" />
    <line x1="74" y1="258" x2="1206" y2="258" stroke="#1A1A2E" stroke-width="1" opacity="0.08" />
    <text x="100" y="237" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">Template count</text>
    <text x="640" y="237" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#5C5C7A">23 (rotation-based)</text>
    <text x="980" y="237" text-anchor="middle" font-family="Impact, sans-serif" font-size="16" font-weight="900" fill="#00C896">26 (spec-driven)</text>

    <!-- Row 2 -->
    <rect x="74" y="258" width="1132" height="56" fill="#F5EDE0" />
    <line x1="74" y1="314" x2="1206" y2="314" stroke="#1A1A2E" stroke-width="1" opacity="0.08" />
    <text x="100" y="293" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">Content planning</text>
    <text x="640" y="293" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#5C5C7A">1 section = 1 slide</text>
    <text x="980" y="293" text-anchor="middle" font-family="Impact, sans-serif" font-size="16" font-weight="900" fill="#00C896">Model-driven split</text>

    <!-- Row 3 -->
    <rect x="74" y="314" width="1132" height="56" fill="#FFF8EE" />
    <line x1="74" y1="370" x2="1206" y2="370" stroke="#1A1A2E" stroke-width="1" opacity="0.08" />
    <text x="100" y="349" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">Overflow handling</text>
    <text x="640" y="349" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#5C5C7A">Silent truncation</text>
    <text x="980" y="349" text-anchor="middle" font-family="Impact, sans-serif" font-size="16" font-weight="900" fill="#00C896">Reflow engine</text>

    <!-- Row 4 -->
    <rect x="74" y="370" width="1132" height="56" fill="#F5EDE0" />
    <line x1="74" y1="426" x2="1206" y2="426" stroke="#1A1A2E" stroke-width="1" opacity="0.08" />
    <text x="100" y="405" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">Visual hierarchy</text>
    <text x="640" y="405" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#5C5C7A">Font-size only</text>
    <text x="980" y="405" text-anchor="middle" font-family="Impact, sans-serif" font-size="16" font-weight="900" fill="#00C896">Card weight system</text>

    <!-- Row 5 -->
    <rect x="74" y="426" width="1132" height="56" fill="#FFF8EE" />
    <line x1="74" y1="482" x2="1206" y2="482" stroke="#1A1A2E" stroke-width="1" opacity="0.08" />
    <text x="100" y="461" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">Theming</text>
    <text x="640" y="461" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#5C5C7A">Hardcoded colors</text>
    <text x="980" y="461" text-anchor="middle" font-family="Impact, sans-serif" font-size="16" font-weight="900" fill="#00C896">CSS variables + tokens</text>

    <!-- Row 6 -->
    <rect x="74" y="482" width="1132" height="56" fill="#F5EDE0" />
    <line x1="74" y1="538" x2="1206" y2="538" stroke="#1A1A2E" stroke-width="1" opacity="0.08" />
    <text x="100" y="517" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">Layout validation</text>
    <text x="640" y="517" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#5C5C7A">None</text>
    <text x="980" y="517" text-anchor="middle" font-family="Impact, sans-serif" font-size="16" font-weight="900" fill="#00C896">Playwright + reflow</text>

    <!-- Row 7 -->
    <rect x="74" y="538" width="1132" height="56" fill="#FFF8EE" />
    <text x="100" y="573" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">Natural language edit</text>
    <text x="640" y="573" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#5C5C7A">Not supported</text>
    <text x="980" y="573" text-anchor="middle" font-family="Impact, sans-serif" font-size="16" font-weight="900" fill="#00C896">SlidePlan edit API</text>

    <!-- 底部标签 -->
    <rect x="74" y="606" width="566" height="38" fill="#5C5C7A" fill-opacity="0.1" />
    <text x="360" y="630" text-anchor="middle" font-family="Impact, sans-serif" font-size="14" font-weight="900" fill="#5C5C7A" letter-spacing="1">LEGACY SYSTEM</text>
    <rect x="640" y="606" width="566" height="38" fill="#00C896" fill-opacity="0.1" />
    <text x="920" y="630" text-anchor="middle" font-family="Impact, sans-serif" font-size="14" font-weight="900" fill="#00C896" letter-spacing="1">PREMIUM SYSTEM</text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#5C5C7A">功能对比 · Legacy vs Premium</text>
    <text x="1220" y="700" text-anchor="end" font-family="Impact, sans-serif" font-size="14" font-weight="900" fill="#1A1A2E" letter-spacing="3">21 / 22</text>
  </g>
</svg>
