<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .paper { fill: #FFF8EE; }
      .paper-soft { fill: #FFE9C7; }
      .ink { fill: #1A1A2E; }
      .ink-soft { fill: #4A4A6A; }
      .pink { fill: #FF3DA5; }
      .blue { fill: #00B8D9; }
      .yellow { fill: #FFD93D; }
      .mint { fill: #00C896; }
      .coral { fill: #FF6B4A; }
      .line-ink { stroke: #1A1A2E; stroke-width: 6; }
      .line-dash { stroke: #1A1A2E; stroke-width: 4; stroke-dasharray: 12 12; }
      .chip-text {
        font-family: "Montserrat", "Noto Sans SC", sans-serif;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.16em;
      }
      .title {
        font-family: "Georgia", "Times New Roman", serif;
        font-size: 112px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      .subtitle {
        font-family: "Montserrat", "Noto Sans SC", sans-serif;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .body {
        font-family: "Montserrat", "Noto Sans SC", sans-serif;
        font-size: 26px;
        font-weight: 500;
        line-height: 1.45;
      }
      .label {
        font-family: "Montserrat", "Noto Sans SC", sans-serif;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .small {
        font-family: "Montserrat", "Noto Sans SC", sans-serif;
        font-size: 18px;
        font-weight: 600;
      }
    </style>
    <pattern id="dots-a" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.2" fill="#1A1A2E" fill-opacity="0.35"/>
    </pattern>
    <filter id="shadow-a" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="10" dy="10" stdDeviation="0" flood-color="#1A1A2E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" class="paper"/>
  <circle cx="142" cy="778" r="132" fill="#00C896" fill-opacity="0.18"/>
  <circle cx="1482" cy="98" r="158" fill="#00B8D9" fill-opacity="0.20"/>
  <circle cx="1328" cy="774" r="98" fill="#FF3DA5" fill-opacity="0.15"/>

  <rect x="78" y="62" width="240" height="58" rx="0" class="yellow line-ink"/>
  <text x="106" y="100" class="chip-text ink">SECTION 01</text>

  <rect x="1220" y="734" width="236" height="60" rx="0" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="6"/>
  <text x="1260" y="773" class="chip-text ink">01 / 12</text>

  <rect x="90" y="158" width="640" height="586" rx="30" fill="#FFFFFF" filter="url(#shadow-a)"/>
  <rect x="90" y="158" width="640" height="586" rx="30" fill="none" stroke="#1A1A2E" stroke-width="6"/>

  <text x="140" y="280" class="title ink">Big Idea</text>
  <text x="140" y="388" class="title ink">Goes Here</text>

  <text x="142" y="470" class="subtitle ink-soft">A Memphis-style hero slide template for title-driven storytelling.</text>
  <text x="142" y="532" class="body ink-soft">Use this area for a concise supporting message, a project tagline,</text>
  <text x="142" y="572" class="body ink-soft">or a one-sentence explanation that frames the presentation.</text>

  <rect x="140" y="628" width="182" height="68" rx="22" class="coral"/>
  <rect x="140" y="628" width="182" height="68" rx="22" fill="none" stroke="#1A1A2E" stroke-width="6"/>
  <text x="177" y="670" class="label" fill="#FFF8EE">Primary Tag</text>

  <rect x="344" y="628" width="182" height="68" rx="22" class="blue"/>
  <rect x="344" y="628" width="182" height="68" rx="22" fill="none" stroke="#1A1A2E" stroke-width="6"/>
  <text x="386" y="670" class="label" fill="#FFF8EE">Key Theme</text>

  <rect x="548" y="628" width="132" height="68" rx="22" class="mint"/>
  <rect x="548" y="628" width="132" height="68" rx="22" fill="none" stroke="#1A1A2E" stroke-width="6"/>
  <text x="582" y="670" class="label" fill="#FFF8EE">CTA</text>

  <g transform="translate(814 122)">
    <rect x="0" y="0" width="664" height="526" rx="34" class="paper-soft" filter="url(#shadow-a)"/>
    <rect x="0" y="0" width="664" height="526" rx="34" fill="none" stroke="#1A1A2E" stroke-width="6"/>
    <rect x="58" y="62" width="548" height="402" rx="26" fill="#FFFFFF"/>
    <rect x="58" y="62" width="548" height="402" rx="26" fill="none" stroke="#1A1A2E" stroke-width="4" stroke-dasharray="14 10"/>
    <text x="170" y="272" class="subtitle ink-soft">Image / visual placeholder</text>
    <text x="148" y="324" class="small ink-soft">Replace this block with photography, illustration, or a product mockup.</text>

    <circle cx="524" cy="120" r="88" class="coral"/>
    <rect x="72" y="328" width="128" height="128" class="mint" fill-opacity="0.82"/>
    <path d="M448 376C480 334 528 332 560 374C592 416 640 414 672 372" stroke="#00C896" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g transform="translate(888 686)">
    <rect x="0" y="0" width="180" height="98" rx="24" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="6"/>
    <text x="32" y="42" class="label ink">Insight</text>
    <text x="32" y="72" class="small ink-soft">Short note</text>
  </g>

  <g transform="translate(1094 686)">
    <rect x="0" y="0" width="180" height="98" rx="24" class="yellow"/>
    <rect x="0" y="0" width="180" height="98" rx="24" fill="none" stroke="#1A1A2E" stroke-width="6"/>
    <text x="28" y="42" class="label ink">Signal</text>
    <text x="28" y="72" class="small ink-soft">Metric or hook</text>
  </g>

  <rect x="1260" y="58" width="180" height="80" fill="url(#dots-a)"/>
  <rect x="108" y="780" width="208" height="62" fill="url(#dots-a)"/>
  <path d="M1130 94C1154 66 1190 66 1214 94C1238 122 1274 122 1298 94" stroke="#00C896" stroke-width="8" stroke-linecap="round"/>
  <path d="M702 728C766 690 810 728 854 746C888 760 920 750 950 724" class="line-dash" fill="none"/>
  <path d="M98 164L150 242L46 242Z" class="yellow line-ink"/>
  <circle cx="164" cy="150" r="32" class="coral"/>
</svg>
