<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg"><rect width="1280" height="720" fill="#FFF8EE" /></g>
  <g id="header">
    <rect x="60" y="55" width="14" height="60" fill="#FF6B4A" />
    <text x="90" y="95" font-family="Impact, Arial Black, sans-serif" font-size="48" font-weight="900" fill="#1A1A2E" letter-spacing="1">TRANSFORMATION</text>
    <text x="90" y="125" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#5C5C7A" letter-spacing="3">前后对比 · BEFORE &amp; AFTER</text>
    <g transform="translate(1140, 60)"><rect x="0" y="0" width="26" height="26" fill="#FF3DA5" stroke="#1A1A2E" stroke-width="2" /><rect x="28" y="0" width="26" height="26" fill="#00B8D9" stroke="#1A1A2E" stroke-width="2" /><rect x="0" y="28" width="26" height="26" fill="#00C896" stroke="#1A1A2E" stroke-width="2" /><rect x="28" y="28" width="26" height="26" fill="#FFD93D" stroke="#1A1A2E" stroke-width="2" /></g>
  </g>
  <!-- BEFORE -->
  <g id="before">
    <path fill="#FFF8EE" stroke="#1A1A2E" stroke-width="4" d="M74,150 H590 A14,14 0 0 1 604,164 V480 A14,14 0 0 1 590,494 H74 A14,14 0 0 1 60,480 V164 A14,14 0 0 1 74,150 Z" />
    <path d="M 64 150 h 536 a 10 10 0 0 1 4 4 v 56 h -544 v -56 a 10 10 0 0 1 4 -4 Z" fill="#5C5C7A" />
    <g transform="translate(76,160) scale(2.25)" fill="#FFF8EE"><path d="M8 16L0 6H6V0H10V6H16L8 16Z"/></g>
    <text x="122" y="186" font-family="Impact, Arial Black, sans-serif" font-size="24" font-weight="900" fill="#FFF8EE" letter-spacing="2">BEFORE</text>
    <circle cx="100" cy="250" r="6" fill="#5C5C7A" stroke="#1A1A2E" stroke-width="2" />
    <text x="120" y="256" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">Manual slide creation, 15 min each</text>
    <circle cx="100" cy="286" r="6" fill="#5C5C7A" stroke="#1A1A2E" stroke-width="2" />
    <text x="120" y="292" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">Inconsistent visual style across deck</text>
    <circle cx="100" cy="322" r="6" fill="#5C5C7A" stroke="#1A1A2E" stroke-width="2" />
    <text x="120" y="328" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">Text-heavy slides with no hierarchy</text>
    <circle cx="100" cy="358" r="6" fill="#5C5C7A" stroke="#1A1A2E" stroke-width="2" />
    <text x="120" y="364" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">Random color choices, no design system</text>
    <line x1="100" y1="394" x2="560" y2="394" stroke="#1A1A2E" stroke-width="1" stroke-dasharray="4,4" opacity="0.2" />
    <text x="100" y="430" font-family="Impact, Arial Black, sans-serif" font-size="48" font-weight="900" fill="#5C5C7A" letter-spacing="-1">~15min</text>
    <text x="100" y="460" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#5C5C7A">average per slide</text>
  </g>
  <!-- Arrow -->
  <g transform="translate(640,320)"><circle cx="0" cy="0" r="24" fill="#FF6B4A" stroke="#1A1A2E" stroke-width="3" /><path d="M-8,-6 L8,0 L-8,6 Z" fill="#FFF8EE" /></g>
  <!-- AFTER -->
  <g id="after">
    <path fill="#FFF8EE" stroke="#1A1A2E" stroke-width="4" d="M688,150 H1206 A14,14 0 0 1 1220,164 V480 A14,14 0 0 1 1206,494 H688 A14,14 0 0 1 674,480 V164 A14,14 0 0 1 688,150 Z" />
    <path d="M 678 150 h 528 a 10 10 0 0 1 4 4 v 56 h -536 v -56 a 10 10 0 0 1 4 -4 Z" fill="#00C896" />
    <g transform="translate(690,160) scale(2.25)" fill="#FFF8EE"><path d="M8 0L16 10H10V16H6V10H0L8 0Z"/></g>
    <text x="736" y="186" font-family="Impact, Arial Black, sans-serif" font-size="24" font-weight="900" fill="#FFF8EE" letter-spacing="2">AFTER</text>
    <circle cx="714" cy="250" r="6" fill="#00C896" stroke="#1A1A2E" stroke-width="2" />
    <text x="734" y="256" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E"><tspan fill="#C0392B" font-weight="900">Template-driven</tspan>, 2 min per slide</text>
    <circle cx="714" cy="286" r="6" fill="#00C896" stroke="#1A1A2E" stroke-width="2" />
    <text x="734" y="292" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E"><tspan fill="#C0392B" font-weight="900">Consistent design system</tspan> across all</text>
    <circle cx="714" cy="322" r="6" fill="#00C896" stroke="#1A1A2E" stroke-width="2" />
    <text x="734" y="328" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E"><tspan fill="#C0392B" font-weight="900">Clear visual hierarchy</tspan> auto-applied</text>
    <circle cx="714" cy="358" r="6" fill="#00C896" stroke="#1A1A2E" stroke-width="2" />
    <text x="734" y="364" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E"><tspan fill="#C0392B" font-weight="900">Theme tokens</tspan> for color &amp; spacing</text>
    <line x1="714" y1="394" x2="1180" y2="394" stroke="#1A1A2E" stroke-width="1" stroke-dasharray="4,4" opacity="0.2" />
    <text x="714" y="430" font-family="Impact, Arial Black, sans-serif" font-size="48" font-weight="900" fill="#1A1A2E" letter-spacing="-1">~2min</text>
    <text x="714" y="460" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#5C5C7A">average per slide</text>
  </g>
  <!-- Takeaway -->
  <g id="takeaway">
    <rect x="60" y="520" width="1160" height="50" rx="4" fill="#FFD93D" stroke="#1A1A2E" stroke-width="3" />
    <text x="640" y="552" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="22" font-weight="900" fill="#1A1A2E" letter-spacing="1">RESULT: 87% TIME SAVED · CONSISTENT QUALITY · ZERO OVERFLOW</text>
  </g>
  <!-- Impovement metrics -->
  <g id="metrics">
    <text x="220" y="620" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="36" font-weight="900" fill="#00C896">87%</text>
    <text x="220" y="648" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#5C5C7A">time saved</text>
    <text x="520" y="620" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="36" font-weight="900" fill="#00C896">96%</text>
    <text x="520" y="648" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#5C5C7A">pass rate</text>
    <text x="820" y="620" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="36" font-weight="900" fill="#00C896">26</text>
    <text x="820" y="648" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#5C5C7A">templates</text>
    <text x="1080" y="620" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="36" font-weight="900" fill="#00C896">0</text>
    <text x="1080" y="648" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#5C5C7A">overflow</text>
  </g>
  <g id="footer">
    <text x="60" y="700" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#5C5C7A">前后对比 · 效率与质量的双重提升</text>
    <text x="1220" y="700" text-anchor="end" font-family="Impact, sans-serif" font-size="14" font-weight="900" fill="#1A1A2E" letter-spacing="3">15 / 16</text>
  </g>
</svg>
