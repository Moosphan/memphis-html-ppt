<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg"><rect width="1280" height="720" fill="#FFF8EE" /></g>
  <g id="header">
    <rect x="60" y="55" width="14" height="60" fill="#FF6B4A" />
    <text x="90" y="95" font-family="Impact, Arial Black, sans-serif" font-size="48" font-weight="900" fill="#1A1A2E" letter-spacing="1">WORKFLOW</text>
    <text x="90" y="125" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#5C5C7A" letter-spacing="3">工作流程 · CROSS-FUNCTIONAL</text>
    <g transform="translate(1140, 60)"><rect x="0" y="0" width="26" height="26" fill="#FF3DA5" stroke="#1A1A2E" stroke-width="2" /><rect x="28" y="0" width="26" height="26" fill="#00B8D9" stroke="#1A1A2E" stroke-width="2" /><rect x="0" y="28" width="26" height="26" fill="#00C896" stroke="#1A1A2E" stroke-width="2" /><rect x="28" y="28" width="26" height="26" fill="#FFD93D" stroke="#1A1A2E" stroke-width="2" /></g>
  </g>

  <!-- 表格框架 -->
  <g id="grid">
    <path fill="#FFF8EE" stroke="#1A1A2E" stroke-width="4" d="M74,150 H1206 A14,14 0 0 1 1220,164 V644 A14,14 0 0 1 1206,658 H74 A14,14 0 0 1 60,644 V164 A14,14 0 0 1 74,150 Z" />

    <!-- 列头 -->
    <rect x="60" y="150" width="180" height="50" fill="#5C5C7A" />
    <text x="150" y="182" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="14" font-weight="900" fill="#FFF8EE" letter-spacing="2">TEAM</text>
    <rect x="240" y="150" width="240" height="50" fill="#FF3DA5" />
    <text x="360" y="182" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="14" font-weight="900" fill="#FFF8EE" letter-spacing="2">PLAN</text>
    <rect x="480" y="150" width="240" height="50" fill="#00B8D9" />
    <text x="600" y="182" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="14" font-weight="900" fill="#FFF8EE" letter-spacing="2">BUILD</text>
    <rect x="720" y="150" width="240" height="50" fill="#FFD93D" />
    <text x="840" y="182" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="14" font-weight="900" fill="#1A1A2E" letter-spacing="2">VALIDATE</text>
    <rect x="960" y="150" width="246" height="50" fill="#00C896" />
    <text x="1084" y="182" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="14" font-weight="900" fill="#FFF8EE" letter-spacing="2">SHIP</text>

    <!-- Lane 1: Design -->
    <rect x="60" y="200" width="180" height="140" fill="#FF3DA5" fill-opacity="0.08" />
    <text x="150" y="276" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="16" font-weight="900" fill="#1A1A2E" letter-spacing="1">DESIGN</text>
    <!-- Tasks -->
    <rect x="260" y="220" width="200" height="40" rx="8" fill="#FF3DA5" stroke="#1A1A2E" stroke-width="2" />
    <text x="360" y="246" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#FFF8EE">Define tokens</text>
    <rect x="260" y="280" width="200" height="40" rx="8" fill="#FF3DA5" stroke="#1A1A2E" stroke-width="2" />
    <text x="360" y="306" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#FFF8EE">SVG masters</text>
    <rect x="500" y="250" width="200" height="40" rx="8" fill="#00B8D9" stroke="#1A1A2E" stroke-width="2" />
    <text x="600" y="276" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#FFF8EE">Review HTML</text>
    <rect x="980" y="250" width="200" height="40" rx="8" fill="#00C896" stroke="#1A1A2E" stroke-width="2" />
    <text x="1080" y="276" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#FFF8EE">Visual sign-off</text>

    <!-- Lane 2: Engineering -->
    <rect x="60" y="340" width="180" height="140" fill="#00B8D9" fill-opacity="0.08" />
    <text x="150" y="416" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="16" font-weight="900" fill="#1A1A2E" letter-spacing="1">ENGINEERING</text>
    <rect x="500" y="360" width="200" height="40" rx="8" fill="#00B8D9" stroke="#1A1A2E" stroke-width="2" />
    <text x="600" y="386" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#FFF8EE">Build renderers</text>
    <rect x="500" y="420" width="200" height="40" rx="8" fill="#00B8D9" stroke="#1A1A2E" stroke-width="2" />
    <text x="600" y="446" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#FFF8EE">Slot filler logic</text>
    <rect x="740" y="360" width="200" height="40" rx="8" fill="#FFD93D" stroke="#1A1A2E" stroke-width="2" />
    <text x="840" y="386" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1A1A2E">Playwright tests</text>
    <rect x="740" y="420" width="200" height="40" rx="8" fill="#FFD93D" stroke="#1A1A2E" stroke-width="2" />
    <text x="840" y="446" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1A1A2E">Reflow engine</text>
    <rect x="980" y="390" width="200" height="40" rx="8" fill="#00C896" stroke="#1A1A2E" stroke-width="2" />
    <text x="1080" y="416" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#FFF8EE">Export pipeline</text>

    <!-- Lane 3: Product -->
    <rect x="60" y="480" width="180" height="140" fill="#FFD93D" fill-opacity="0.08" />
    <text x="150" y="556" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="16" font-weight="900" fill="#1A1A2E" letter-spacing="1">PRODUCT</text>
    <rect x="260" y="500" width="200" height="40" rx="8" fill="#FF3DA5" stroke="#1A1A2E" stroke-width="2" />
    <text x="360" y="526" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#FFF8EE">Define intents</text>
    <rect x="260" y="560" width="200" height="40" rx="8" fill="#FF3DA5" stroke="#1A1A2E" stroke-width="2" />
    <text x="360" y="586" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#FFF8EE">Content budgets</text>
    <rect x="740" y="530" width="200" height="40" rx="8" fill="#FFD93D" stroke="#1A1A2E" stroke-width="2" />
    <text x="840" y="556" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1A1A2E">Acceptance criteria</text>
    <rect x="980" y="530" width="200" height="40" rx="8" fill="#00C896" stroke="#1A1A2E" stroke-width="2" />
    <text x="1080" y="556" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#FFF8EE">User testing</text>
  </g>

  <!-- 行分隔线 -->
  <line x1="240" y1="340" x2="1206" y2="340" stroke="#1A1A2E" stroke-width="1" stroke-dasharray="6,4" opacity="0.15" />
  <line x1="240" y1="480" x2="1206" y2="480" stroke="#1A1A2E" stroke-width="1" stroke-dasharray="6,4" opacity="0.15" />

  <g id="footer">
    <text x="60" y="700" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#5C5C7A">工作流程 · 3 团队 × 5 阶段</text>
    <text x="1220" y="700" text-anchor="end" font-family="Impact, sans-serif" font-size="14" font-weight="900" fill="#1A1A2E" letter-spacing="3">24 / 24</text>
  </g>
</svg>
