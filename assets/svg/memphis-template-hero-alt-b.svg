<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">

  <!-- ═══ Hero Cover Alt B — 左色块构图 ═══ -->
  <!-- 特点: 左侧大面积色块 + 右侧标题文字, 杂志封面感 -->

  <g id="bg">
    <rect width="1280" height="720" fill="#FFF8EE" />
  </g>

  <!-- ═══ 左侧大面积色块 (占 45%) ═══ -->
  <g id="left-panel">
    <!-- 主色块 -->
    <rect x="0" y="0" width="560" height="720" fill="#FF6B4A" />

    <!-- Memphis 装饰 (在色块上, 用白色/深色) -->
    <!-- 大圆 -->
    <circle cx="280" cy="260" r="120" fill="none" stroke="#FFF8EE" stroke-width="3" opacity="0.30" />
    <circle cx="280" cy="260" r="80" fill="none" stroke="#FFF8EE" stroke-width="2" opacity="0.20" />

    <!-- 闪电图标 (大, 居中) -->
    <g transform="translate(216, 196) scale(6)" fill="#FFF8EE" opacity="0.25">
      <path d="M9 7L10 0H8L2 7V9H7L6 16H8L14 9L14 7H9Z" />
    </g>

    <!-- 散布几何 -->
    <rect x="80" y="500" width="40" height="40" fill="#FFD93D" stroke="#1A1A2E" stroke-width="3" transform="rotate(-15 100 520)" />
    <polygon points="420,480 445,530 395,530" fill="#00C896" stroke="#1A1A2E" stroke-width="3" />
    <circle cx="460" cy="160" r="20" fill="#00B8D9" stroke="#1A1A2E" stroke-width="3" />
    <circle cx="120" cy="140" r="14" fill="#FFD93D" stroke="#1A1A2E" stroke-width="2" />
    <circle cx="440" cy="400" r="10" fill="#FF3DA5" stroke="#1A1A2E" stroke-width="2" />

    <!-- 虚线横线 (装饰) -->
    <line x1="80" y1="600" x2="480" y2="600" stroke="#FFF8EE" stroke-width="2" stroke-dasharray="8,8" opacity="0.25" />

    <!-- 色块内数字/年份 -->
    <text x="280" y="660" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="48" font-weight="900" fill="#FFF8EE" letter-spacing="4" opacity="0.20">2025</text>
  </g>

  <!-- ═══ 右侧: 标题区域 ═══ -->
  <g id="right-content">
    <!-- 分类标签 -->
    <text x="600" y="120" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="800" fill="#5C5C7A" letter-spacing="4">PREMIUM SLIDE DESIGN</text>

    <!-- 主标题 -->
    <text x="600" y="240" font-family="Impact, Arial Black, sans-serif" font-size="80" font-weight="900" fill="#1A1A2E" letter-spacing="1">DESIGN</text>
    <text x="600" y="326" font-family="Impact, Arial Black, sans-serif" font-size="80" font-weight="900" fill="#1A1A2E" letter-spacing="1">THE</text>
    <text x="600" y="412" font-family="Impact, Arial Black, sans-serif" font-size="80" font-weight="900" fill="#1A1A2E" letter-spacing="1">FUTURE.</text>

    <!-- 分隔线 -->
    <line x1="600" y1="440" x2="900" y2="440" stroke="#1A1A2E" stroke-width="3" />

    <!-- 副标题 -->
    <text x="600" y="480" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#5C5C7A" letter-spacing="1">A Memphis-inspired framework for</text>
    <text x="600" y="506" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#5C5C7A" letter-spacing="1">premium presentation design.</text>

    <!-- 右下: 2×2 彩色方块 -->
    <g transform="translate(1140, 560)">
      <rect x="0" y="0" width="24" height="24" fill="#FF3DA5" stroke="#1A1A2E" stroke-width="2" />
      <rect x="28" y="0" width="24" height="24" fill="#00B8D9" stroke="#1A1A2E" stroke-width="2" />
      <rect x="0" y="28" width="24" height="24" fill="#00C896" stroke="#1A1A2E" stroke-width="2" />
      <rect x="28" y="28" width="24" height="24" fill="#FFD93D" stroke="#1A1A2E" stroke-width="2" />
    </g>

    <!-- 右下: 小圆点装饰 -->
    <circle cx="1100" cy="640" r="10" fill="#FFD93D" stroke="#1A1A2E" stroke-width="2" />
    <circle cx="1120" cy="660" r="6" fill="#00B8D9" stroke="#1A1A2E" stroke-width="2" />
  </g>

  <!-- ═══ Footer ═══ -->
  <text x="600" y="680" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#5C5C7A">MEMPHIS DESIGN SYSTEM · 自 2025 年起</text>
  <text x="1220" y="680" text-anchor="end" font-family="Impact, sans-serif" font-size="14" font-weight="900" fill="#1A1A2E" letter-spacing="3">01 / 12</text>

</svg>
